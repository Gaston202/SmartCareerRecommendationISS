[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smartcareer-fastapi-backend"
version = "0.1.0"
description = "FastAPI migration backend for Smart Career Recommendation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "python-jose[cryptography]>=3.3.0",
  "passlib[bcrypt]>=1.7.4",
  "sqlalchemy>=2.0.0",
  "alembic>=1.13.0",
  "httpx>=0.27.0",
  "redis>=5.0.0",
  "orjson>=3.10.0",
  "python-multipart>=0.0.9",
  "supabase>=2.29.0,<3.0.0",
  "openai>=1.0.0",
  "python-jobspy>=1.1.82",
  "beautifulsoup4>=4.12.0",
  "lxml>=5.3.0",
  "scrapling>=0.4.7",
  "pandas>=2.2.0",
  "numpy>=1.26.0",
  "pdfminer.six>=20221105",
  "PyPDF2>=3.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.23.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.6.0",
  "mypy>=1.11.0",
]

prod = [
  "gunicorn>=21.2.0",
  "uvloop>=0.19.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-q"
testpaths = ["tests"]
